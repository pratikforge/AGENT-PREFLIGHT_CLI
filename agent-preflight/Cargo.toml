[package]
name = "agent-preflight"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
clap = { version = "=4.6.2", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.0"
thiserror = "=2.0.19"
ignore = "=0.4.30"
tree-sitter = "=0.26.11"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"

[dev-dependencies]
assert_cmd = "=2.2.2"
tempfile = "=3.27.0"
